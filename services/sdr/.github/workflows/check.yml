name: Verificar piloto isolado

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m py_compile tools/*.py delivery/build_platform_contract.py
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/sdr-next .
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            delivery/lovable-template/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build:pilot
        working-directory: frontend
      - run: node tools/check_whatsapp_ui.mjs
      - run: node tools/check_metrics_dashboard.mjs
      - run: node tools/check_customer_data_ui.mjs
      - run: node tools/check_calendar_ui.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: delivery/lovable-template
      - run: python3 tools/package_lovable.py
