name: Agent foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [services/sdr, packages/deeph]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            services/sdr/go.sum
            packages/deeph/go.sum
      - run: go test ./...
        working-directory: ${{ matrix.module }}
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/portal
      - run: npx next typegen && npx tsc --noEmit && node --test scripts/test-demo-session.cjs scripts/test-demo-proxy.cjs
        working-directory: apps/portal
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/catalog_mermaid.py && npm run diagrams:check
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git /tmp/flutter-sdk
      - run: echo "/tmp/flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/genesis_flutter
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test apps/genesis_flutter/test/*.test.cjs
      - run: python3 scripts/build-genesis-flutter.py
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/sdr/go.sum
      - run: docker pull golang:1.26
      - run: go test -run TestRuntimeIntegration -count=1 -timeout=4m .
        working-directory: services/sdr
        env:
          ARKOM_RUNTIME_INTEGRATION: 'true'
