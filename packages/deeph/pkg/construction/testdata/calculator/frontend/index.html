<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Calculadora Go</title><style>body{background:#121315;color:#eee;font:18px system-ui;padding:32px}input,select,button{font:inherit;padding:12px;max-width:140px;margin:8px;background:#25262a;color:#eee;border:1px solid #a68a55;border-radius:8px}button{background:#d4b477;color:#161616}output{display:block;margin:24px 8px}</style></head><body><h1>Calculadora Go</h1><p>Inicie o backend no menu da prévia.</p><form id="calculator"><input aria-label="Primeiro valor" id="a" type="number" value="12" step="any"><select aria-label="Operação" id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select><input aria-label="Segundo valor" id="b" type="number" value="30" step="any"><button>Calcular</button></form><output id="result" aria-live="polite"></output><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('output');try{const r=await fetch('/api/calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:Number(document.querySelector('#a').value),b:Number(document.querySelector('#b').value),op:document.querySelector('#op').value})});if(!r.ok)throw Error(await r.text());out.textContent='Resultado: '+(await r.json()).result;}catch(error){out.textContent=error.message;}};</script></body></html>
