name: CI Gate
# Kit Bilhon — agregador único (padrão synkra-hub / alls-green).
# Evolução do antigo workflow "CI" (job unico `quality` em `master`, branch que nao
# existe neste repo — o default e `main`). Agora dispara em PRs para `main` e divide
# a validacao em jobs por-repo, com o agregador `CI Gate` como unico check exigido.
# O ruleset da main (ou o guardiao guard-main.yml, em conta pessoal) exige SO o check
# "CI Gate"; os jobs internos evoluem sem tocar a protecao.
# REGRA DE OURO (licao synkra STORY-242.W1.9): TODO job deste workflow entra no `needs`
# do agregador — job bloqueante fora do needs = CI vermelho com merge liberado.
on:
  pull_request:
    branches: [main]
concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  uptodate:
    name: Branch atualizada com a base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar se a branch esta atras da base
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          behind=$(git rev-list --count "${{ github.event.pull_request.head.sha }}..origin/${{ github.base_ref }}")
          if [ "$behind" -gt 0 ]; then
            echo "::error::Branch esta $behind commit(s) atras de ${{ github.base_ref }} — atualize (merge/rebase) antes do merge."
            exit 1
          fi

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  ci-gate:
    name: CI Gate
    if: always()
    needs: [uptodate, typecheck, build]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
