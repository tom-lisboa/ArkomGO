name: Guardiao da main
# Kit Bilhon — sentinela para repos SEM ruleset (conta pessoal Free; origem: gavi/Homer).
# Todo push DIRETO na main que NAO veio de um PR — e nao e do dono — e REVERTIDO + issue.
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Analisar o push
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actor="${{ github.actor }}"
          admin=false
          if [ "$actor" = "thiagofinch" ]; then admin=true; fi
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          # Fail-safe: se a API falhar, trata como "tem PR" para NAO reverter a toa
          if prs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length' 2>/dev/null); then
            echo "prs=$prs" >> "$GITHUB_OUTPUT"
          else
            echo "prs=skip" >> "$GITHUB_OUTPUT"
          fi
      - name: Push direto detectado?
        id: v
        run: |
          if [ "${{ steps.check.outputs.admin }}" = "false" ] && [ "${{ steps.check.outputs.prs }}" = "0" ]; then
            echo "violate=true" >> "$GITHUB_OUTPUT"
          else
            echo "violate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout (para reverter)
        if: steps.v.outputs.violate == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 2
      - name: Reverter push direto
        if: steps.v.outputs.violate == 'true'
        continue-on-error: true
        run: |
          git config user.name "guardiao-main"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-edit ${{ github.sha }}
          git push origin main
      - name: Avisar (abrir issue)
        if: steps.v.outputs.violate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Push direto na main revertido (${{ github.sha }})" \
            --body "@${{ github.actor }} deu push direto na main sem PR — revertido automaticamente (CONTRIBUTING.md). Trabalhe na sua branch e abra um PR. cc @thiagofinch" \
            || echo "nao consegui abrir a issue (segue o revert)"
